services:
  - type: web
    name: mining-digital-twin-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: sh start.sh
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DEMO_MODE
        value: "true"
      - key: MODEL_VERSION
        value: "1.0.0"
      - key: ALLOWED_ORIGINS
        value: "*"
